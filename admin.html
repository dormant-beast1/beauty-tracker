<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Beauty Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .password-box { text-align: center; margin: 40px 0; }
        input[type="password"] { padding: 10px; border: 2px solid #ddd; border-radius: 8px; width: 300px; }
        .btn { background: #5b3a8a; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        .user-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .user-card h4 { margin: 5px 0; color: #5b3a8a; }
        .photos { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; }
        .photos img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; border: 2px solid #ddd; }
        .btn-save { background: #4caf50; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-save:hover { opacity: 0.9; }
        .score-input { width: 80px; padding: 8px; border: 2px solid #5b3a8a; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Panel</h1>
        
        <!-- Password -->
        <div id="passwordBox" class="password-box">
            <p>Enter Admin Password:</p>
            <input type="password" id="passInput" placeholder="Password">
            <br><br>
            <button class="btn" onclick="unlock()">Login</button>
        </div>

        <!-- Panel -->
        <div id="panel" style="display:none;">
            <h3>Pending Reviews</h3>
            <div id="usersList"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCTLddjFi-b5c2tKED4oVaDjlN6JdT_kNY", authDomain: "beauty-tracker-8b3c3.firebaseapp.com", projectId: "beauty-tracker-8b3c3", storageBucket: "beauty-tracker-8b3c3.firebasestorage.app", messagingSenderId: "946147639561", appId: "1:946147639561:web:7d401da563859e953c13d8" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // অ্যাডমিন পাসওয়ার্ড (এটি বদলে নিতে পারেন)
        const ADMIN_PASSWORD = "tayeb";

        function unlock() {
            const pass = document.getElementById('passInput').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('passwordBox').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                loadUsers();
            } else {
                alert("Wrong Password!");
            }
        }

        async function loadUsers() {
            const usersDiv = document.getElementById('usersList');
            usersDiv.innerHTML = "";
            
            const q = await db.collection('users').where('status', '==', 'pending').get();
            q.forEach((doc) => {
                const data = doc.data();
                const answers = data.answers || {};
                const photos = answers.photoUrls || [];
                
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <h4>👤 ${data.name || "Unknown"}</h4>
                    <p>📧 ${data.email || "No Email"}</p>
                    <p>🎂 ${data.dob || "No DOB"}</p>
                    <div class="photos">
                        ${photos.map(url => `<img src="${url}" />`).join('')}
                    </div>
                    <p><strong>Voice:</strong> ${answers.voiceUrl ? `<a href="${answers.voiceUrl}" target="_blank">Play Audio</a>` : "No Voice"}</p>
                    <p><strong>Q1 (Lifestyle):</strong> ${answers.q1 || ""}</p>
                    <p><strong>Q2 (Partner):</strong> ${answers.q2 || ""}</p>
                    <p><strong>Q3 (Marriage):</strong> ${answers.q3 || ""}</p>
                    <p><strong>Q4 (Food):</strong> ${answers.q4 || ""}</p>
                    <p><strong>Q5 (Place):</strong> ${answers.q5 || ""}</p>
                    <p><strong>Q6 (Loved one):</strong> ${answers.q6 || ""}</p>
                    <br>
                    <input type="number" class="score-input" id="score-${doc.id}" min="0" max="100" placeholder="Score" />
                    <button class="btn-save" onclick="submitScore('${doc.id}')">Submit Score</button>
                `;
                usersDiv.appendChild(card);
            });
        }

        async function submitScore(userId) {
            const scoreInput = document.getElementById(`score-${userId}`);
            const score = scoreInput.value;
            if (score === "") return alert("Score দিতে হবে!");

            await db.collection('users').doc(userId).update({
                score: parseInt(score),
                status: "reviewed"
            });
            alert("Score দেওয়া হয়েছে! ইউজার এখন দেখতে পাবে।");
            loadUsers();
        }
    </script>
</body>
</html>

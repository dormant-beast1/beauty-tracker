<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Beauty Tracker by Fashison AI</title>
    <!-- Google Fonts (প্রিমিয়াম লুকের জন্য) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            background-image: url('background.jpg'); /* ছবির নাম background.jpg */
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
        }
        
        /* অ্যাডভান্সড গ্লাস ইফেক্ট */
        .glass { 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-radius: 24px; 
            padding: 40px; 
            max-width: 500px; 
            width: 100%; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(255,255,255,0.4); 
            border: 1px solid rgba(255,255,255,0.2);
        }

        .logo { 
            text-align: center; 
            font-size: 2.5rem; 
            font-weight: 800; 
            font-family: 'Playfair Display', serif; 
            background: linear-gradient(45deg, #d65a31, #f6c90e); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 20px; 
            letter-spacing: 1px;
        }

        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 50px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-google { 
            background: white; 
            border: 2px solid #ddd; 
            color: #333; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .btn-google:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }

        .btn-purple { 
            background: linear-gradient(135deg, #764ba2, #d65a31); 
            color: white; 
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }
        .btn-purple:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(118, 75, 162, 0.5); }

        .hidden { display: none !important; }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 2px solid rgba(0,0,0,0.1); 
            border-radius: 10px; 
            font-size: 15px;
            background: rgba(255,255,255,0.9);
            font-family: 'Poppins', sans-serif;
        }
        input:focus, textarea:focus { border-color: #764ba2; outline: none; }

        .card { background: rgba(255,255,255,0.6); padding: 15px; border-radius: 15px; margin: 10px 0; backdrop-filter: blur(5px); }
        
        .upload-box { 
            border: 2px dashed #764ba2; 
            padding: 30px; 
            text-align: center; 
            cursor: pointer; 
            border-radius: 15px; 
            background: rgba(250,250,250,0.8); 
        }
        .upload-box:hover { background: rgba(243,232,255,0.8); }

        img#photoPreview { max-width: 100%; margin-top: 10px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .score-box { 
            background: linear-gradient(135deg, #f093fb, #d65a31); 
            color: white; 
            padding: 15px; 
            border-radius: 15px; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            margin: 10px 0; 
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }
        
        .feedback { 
            background: linear-gradient(135deg, #fdfbfb, #ebedee);
            border-left: 5px solid #4caf50; 
            padding: 20px; 
            margin-top: 20px; 
            border-radius: 10px;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2, h3 { font-family: 'Playfair Display', serif; color: #333; margin-bottom: 15px; }
        p { color: #555; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="glass">
        <div class="logo">✨ Beauty Tracker</div>

        <!-- LOGIN -->
        <div id="step-login">
            <button class="btn btn-google" onclick="googleLogin()">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google দিয়ে লগইন করুন
            </button>
        </div>

        <!-- PROFILE -->
        <div id="step-profile" class="hidden">
            <h3>👤 আপনার তথ্য দিন</h3>
            <input type="text" id="userName" placeholder="আপনার নাম">
            <input type="date" id="dob">
            <button class="btn btn-purple" onclick="saveProfile()">পরবর্তী →</button>
        </div>

        <!-- PHOTO -->
        <div id="step-photo" class="hidden">
            <h3>📸 ছবি আপলোড করুন</h3>
            <div class="upload-box" onclick="document.getElementById('photoInput').click()">
                <p>📁 গ্যালারি অথবা 📷 ক্যামেরা</p>
                <p style="font-size:12px; color:#888;">(ছবি ক্লিক করে সিলেক্ট করুন)</p>
                <img id="photoPreview" class="hidden">
            </div>
            <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" onchange="uploadPhoto(event)">
            <div id="photoLoading" class="hidden" style="text-align:center; margin:10px; color:#764ba2;">🤖 AI বিশ্লেষণ চলছে...</div>
            <div id="photoResult" class="hidden">
                <div class="score-box">✨ সৌন্দর্য স্কোর: <span id="photoScore"></span>/100</div>
                <button class="btn btn-purple" onclick="goVoice()">পরবর্তী →</button>
            </div>
        </div>

        <!-- VOICE -->
        <div id="step-voice" class="hidden">
            <h3>🎙️ ভয়েস রেকর্ড করুন</h3>
            <div class="card">
                <button class="btn btn-purple" onclick="startRec()">🔴 রেকর্ড শুরু</button>
                <button class="btn" onclick="stopRec()" id="stopBtn" style="display:none; background:#333; color:white;">⏹️ বন্ধ করুন</button>
                <audio id="audioPlayer" controls class="hidden" style="margin-top:10px; width:100%;"></audio>
            </div>
            <div id="voiceResult" class="hidden">
                <div class="score-box">🎙️ ভয়েস স্কোর: <span id="voiceScore"></span>/100</div>
                <button class="btn btn-purple" onclick="goQuestions()">পরবর্তী →</button>
            </div>
        </div>

        <!-- QUESTIONS -->
        <div id="step-questions" class="hidden">
            <h3>📝 ব্যক্তিত্ব প্রশ্ন</h3>
            <textarea id="q1" placeholder="১. আপনার জীবনধারা কেমন? (শান্ত/সক্রিয়)"></textarea>
            <textarea id="q2" placeholder="২. আদর্শ সাথীর ৩টি গুণ বলুন"></textarea>
            <textarea id="q3" placeholder="৩. বিবাহিত জীবনে প্রত্যাশা কী?"></textarea>
            <textarea id="q4" placeholder="৪. ক্যারিয়ার লক্ষ্য কী?"></textarea>
            <textarea id="q5" placeholder="৫. প্রিয় শখ কী?"></textarea>
            <button class="btn btn-purple" onclick="submitAll()">🏆 ফলাফল দেখুন</button>
        </div>

        <!-- RESULT -->
        <div id="step-result" class="hidden">
            <h3>🏆 আপনার AI রিপোর্ট</h3>
            <div class="card" style="text-align:center;">
                <p>সৌন্দর্য: <b id="finalBeauty"></b> | ভয়েস: <b id="finalVoice"></b> | ব্যক্তিত্ব: <b id="finalPers"></b></p>
            </div>
            <div class="feedback" id="feedback"></div>
            <button class="btn btn-purple" onclick="location.reload()">🔄 আবার শুরু করুন</button>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCTLddjFi-b5c2tKED4oVaDjlN6JdT_kNY",
            authDomain: "beauty-tracker-8b3c3.firebaseapp.com",
            projectId: "beauty-tracker-8b3c3",
            storageBucket: "beauty-tracker-8b3c3.firebasestorage.app",
            messagingSenderId: "946147639561",
            appId: "1:946147639561:web:7d401da563859e953c13d8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Cloudinary Config
        const CLOUD_NAME = "hbgz4asd";
        const UPLOAD_PRESET = "beauty_tracker";

        let currentUser = null;
        let photoScore = 0;
        let voiceScore = 0;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioBlob = null;

        // LOGIN
        async function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                currentUser = result.user;
                show('step-profile');
            } catch(e) { alert("লগইন সমস্যা: " + e.message); }
        }

        function show(id) {
            document.querySelectorAll('div[id^="step-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // PROFILE SAVE
        async function saveProfile() {
            const name = document.getElementById('userName').value;
            const dob = document.getElementById('dob').value;
            if(!name || !dob) return alert("সব তথ্য দিন!");
            
            await db.collection('users').doc(currentUser.uid).set({
                name, dob, email: currentUser.email
            }, {merge:true});
            show('step-photo');
        }

        // Cloudinary আপলোড ফাংশন
        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            return data.secure_url;
        }

        // PHOTO UPLOAD
        async function uploadPhoto(event) {
            const file = event.target.files[0];
            if(!file) return;

            const img = document.getElementById('photoPreview');
            img.src = URL.createObjectURL(file);
            img.classList.remove('hidden');

            document.getElementById('photoLoading').classList.remove('hidden');

            try {
                const downloadUrl = await uploadToCloudinary(file);
                
                setTimeout(async () => {
                    photoScore = Math.floor(Math.random() * 46) + 55;
                    document.getElementById('photoScore').textContent = photoScore;
                    document.getElementById('photoLoading').classList.add('hidden');
                    document.getElementById('photoResult').classList.remove('hidden');

                    await db.collection('users').doc(currentUser.uid).update({
                        photoUrl: downloadUrl,
                        photoScore: photoScore
                    });
                }, 1500);
            } catch(e) {
                alert("ছবি আপলোড করতে সমস্যা হয়েছে!");
            }
        }

        function goVoice() { show('step-voice'); }

        // VOICE RECORDING
        async function startRec() {
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                audioBlob = new Blob(audioChunks, {type:'audio/webm'});
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = document.getElementById('audioPlayer');
                audio.src = audioUrl;
                audio.classList.remove('hidden');

                try {
                    const downloadUrl = await uploadToCloudinary(audioBlob);
                    
                    voiceScore = Math.floor(Math.random() * 46) + 55;
                    document.getElementById('voiceScore').textContent = voiceScore;
                    document.getElementById('voiceResult').classList.remove('hidden');
                    
                    await db.collection('users').doc(currentUser.uid).update({
                        voiceUrl: downloadUrl,
                        voiceScore: voiceScore
                    });
                } catch(e) {
                    alert("ভয়েস আপলোড করতে সমস্যা হয়েছে!");
                }
            };
            mediaRecorder.start();
            document.querySelector('#step-voice .btn-purple').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
        }

        function stopRec() {
            mediaRecorder.stop();
            document.getElementById('stopBtn').style.display = 'none';
            document.querySelector('#step-voice .btn-purple').style.display = 'block';
        }

        function goQuestions() { show('step-questions'); }

        // SUBMIT QUESTIONS
        async function submitAll() {
            const answers = {
                life: document.getElementById('q1').value,
                partner: document.getElementById('q2').value,
                marriage: document.getElementById('q3').value,
                career: document.getElementById('q4').value,
                hobby: document.getElementById('q5').value
            };

            const totalChars = Object.values(answers).join('').length;
            const persScore = Math.min(100, Math.max(50, Math.floor(totalChars * 0.3) + 45));

            await db.collection('users').doc(currentUser.uid).set({
                answers, personalityScore: persScore
            }, {merge:true});

            document.getElementById('finalBeauty').textContent = photoScore;
            document.getElementById('finalVoice').textContent = voiceScore;
            document.getElementById('finalPers').textContent = persScore;
            
            const total = Math.round((photoScore + voiceScore + persScore) / 3);
            document.getElementById('feedback').innerHTML = 
                `আপনার মোট স্কোর ${total}/100। আপনার তথ্য সফলভাবে আমাদের সার্ভারে (Firebase) সেভ হয়েছে। AI বিশ্লেষণে আপনি আত্মবিশ্বাসী ও আকর্ষণীয়!`;

            show('step-result');
        }
    </script>
</body>
</html>
